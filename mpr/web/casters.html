<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Crew slips</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --enamel: #0c1a13; --panel: #14291e; --rule: #2c4a36;
    --lamp: #ffa81e; --paper: #efede3; --muted: #7d9a86;
    --win: #5fd38a; --dead: #4d6155;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; background: transparent;
    font-family: "Barlow Condensed", "Oswald", "Arial Narrow", sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }
  body {
    display: flex; align-items: flex-start; justify-content: center;
    min-height: 100vh; padding: 20px;
  }
  .rack { display: flex; gap: 16px; align-items: flex-start; }
  .rack[hidden] { display: none; }

  /* one betting slip per crew member */
  .slip {
    width: 320px;
    background: var(--enamel);
    border: 2px solid var(--rule);
    border-radius: 3px;
    box-shadow: 0 0 0 1px #000a, 0 14px 32px #0009;
    overflow: hidden;
  }
  .who {
    background: var(--panel);
    border-bottom: 2px solid var(--rule);
    padding: 11px 16px 9px;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .who h2 {
    margin: 0; font-size: 29px; font-weight: 700;
    color: var(--paper); line-height: 1;
  }
  .who .bank {
    font-size: 22px; font-weight: 600; color: var(--lamp);
  }
  ul { list-style: none; margin: 0; padding: 4px 0; }
  li {
    display: grid;
    grid-template-columns: 8px 1fr auto;
    gap: 0 11px; align-items: center;
    padding: 8px 16px 8px 0;
    border-bottom: 1px solid #1b3225;
  }
  li:last-child { border-bottom: 0; }
  .chip { width: 8px; height: 32px; border-radius: 0 2px 2px 0; }
  .pick {
    font-size: 23px; font-weight: 600; color: var(--paper); line-height: 1.05;
  }
  .on {
    font-size: 17px; font-weight: 500; color: var(--muted); line-height: 1.1;
  }
  .stake {
    text-align: right; font-size: 23px; font-weight: 600; color: #a8c3b1;
  }
  .stake.won  { color: var(--win); }
  .stake.lost { color: var(--dead); text-decoration: line-through; }
  .empty {
    padding: 20px 16px; font-size: 20px; font-weight: 500; color: var(--muted);
  }
  .rail {
    padding: 8px 16px; background: var(--panel);
    border-top: 2px solid var(--rule);
    font-size: 16px; font-weight: 500; color: var(--muted);
  }
</style>
</head>
<body>
<div class="rack" id="rack" hidden></div>

<script>
const fmt = n => n.toLocaleString("en-US");

async function poll() {
  let data;
  try {
    data = await (await fetch("/state.json" + location.search, { cache: "no-store" })).json();
  } catch { return; }

  const rack = document.getElementById("rack");
  if (!data.race || !data.casters || !data.casters.length) { rack.hidden = true; return; }
  rack.hidden = false;
  rack.innerHTML = "";

  for (const c of data.casters) {
    const slip = document.createElement("div");
    slip.className = "slip";

    const head = document.createElement("div");
    head.className = "who";
    const h2 = document.createElement("h2");
    h2.textContent = c.name;
    const bank = document.createElement("div");
    bank.className = "bank";
    bank.textContent = fmt(c.balance);
    head.append(h2, bank);
    slip.appendChild(head);

    if (!c.bets.length) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "No bets down yet.";
      slip.appendChild(empty);
    } else {
      const ul = document.createElement("ul");
      for (const b of c.bets) {
        const li = document.createElement("li");

        const chip = document.createElement("div");
        chip.className = "chip";
        chip.style.background = b.color;

        const mid = document.createElement("div");
        const pick = document.createElement("div");
        pick.className = "pick";
        pick.textContent = b.pick;
        const on = document.createElement("div");
        on.className = "on";
        on.textContent = b.market;
        mid.append(pick, on);

        const stake = document.createElement("div");
        stake.className = "stake";
        if (b.settled && b.payout > 0) {
          stake.classList.add("won");
          stake.textContent = "+" + fmt(b.payout);
        } else if (b.settled) {
          stake.classList.add("lost");
          stake.textContent = fmt(b.amount);
        } else {
          stake.textContent = fmt(b.amount);
        }

        li.append(chip, mid, stake);
        ul.appendChild(li);
      }
      slip.appendChild(ul);
    }

    const rail = document.createElement("div");
    rail.className = "rail";
    rail.textContent = "Fake points only.";
    slip.appendChild(rail);
    rack.appendChild(slip);
  }
}

setInterval(poll, 3000);
poll();
</script>
</body>
</html>
